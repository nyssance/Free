name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  # The commit was already tested when main was pushed; wait for that run instead of testing again.
  tested:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          id=$(gh run list --workflow test.yml --branch main --event push --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$id" ]; then
            echo "::error::No Test run on main for $GITHUB_SHA; push main before the tag"
            exit 1
          fi
          gh run watch "$id" --exit-status
  build:
    needs: tested
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            file: free-darwin-arm64
          - os: windows-latest
            target: windows-x64
            file: free-windows-x64.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun build --compile --aot --trim --disallow-code-generation-from-strings --minify --target=bun-${{ matrix.target }} main.ts --outfile dist/${{ matrix.file }}
      - if: runner.os == 'macOS'
        run: |
          codesign --sign - --force dist/${{ matrix.file }}
          FORCE_COLOR=3 ./dist/${{ matrix.file }} --help | grep -q "nyssance/Free"
          test "$(./dist/${{ matrix.file }} -v)" = "${GITHUB_REF_NAME#v}"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:FORCE_COLOR = "3"
          if (-not (.\dist\${{ matrix.file }} --help | Select-String "nyssance/Free")) { exit 1 }
          if ((.\dist\${{ matrix.file }} -v) -ne $env:GITHUB_REF_NAME.TrimStart("v")) { exit 1 }
      - run: gzip -9 dist/${{ matrix.file }} && ls -lh dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum free-*.gz > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
