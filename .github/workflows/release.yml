name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tested:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.query.outputs.ok }}
    steps:
      - id: query
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          echo "ok=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
  test:
    needs: tested
    if: needs.tested.outputs.ok != 'true'
    uses: ./.github/workflows/test.yml
  build:
    needs: [tested, test]
    if: ${{ !cancelled() && needs.tested.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: |
          for target in darwin-arm64 windows-x64; do
            bun build --compile --minify --target=bun-$target main.ts --outfile dist/free-$target
          done
          codesign --sign - --force dist/free-darwin-arm64
          FORCE_COLOR=3 ./dist/free-darwin-arm64 --help | grep -q "nyssance/Free"
          test "$(./dist/free-darwin-arm64 -v)" = "${GITHUB_REF_NAME#v}"
          gzip -9 dist/*
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
  windows:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: |
          $gz = [IO.File]::OpenRead("dist\free-windows-x64.exe.gz")
          $out = [IO.File]::Create("free.exe")
          [IO.Compression.GZipStream]::new($gz, [IO.Compression.CompressionMode]::Decompress).CopyTo($out)
          $out.Close()
          $gz.Close()
          $env:FORCE_COLOR = "3"
          if (-not (.\free.exe --help | Select-String "nyssance/Free")) { exit 1 }
          if ((.\free.exe -v) -ne $env:GITHUB_REF_NAME.TrimStart("v")) { exit 1 }
  release:
    needs: windows
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
