name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tested:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.query.outputs.ok }}
    steps:
      - id: query
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          echo "ok=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
  test:
    needs: tested
    if: needs.tested.outputs.ok != 'true'
    uses: ./.github/workflows/test.yml
  build:
    needs: [tested, test]
    if: ${{ !cancelled() && needs.tested.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: |
          for target in darwin-arm64 windows-x64; do
            bun build --compile --minify --target=bun-$target main.ts --outfile dist/free-$target
          done
          codesign --sign - --force dist/free-darwin-arm64
          ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
