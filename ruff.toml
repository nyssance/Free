line-length = 120
target-version = "py315"

[lint]
allowed-confusables = ["，", "′"]
dummy-variable-rgx = "^_$"
future-annotations = true
preview = true
select = ["ALL"]
ignore = [ # https://docs.astral.sh/ruff/rules/
    "commented-out-code", # ERA
    "missing-trailing-comma", # COM
    "CPY", "FIX", "TD",
    "undocumented-public-method", "undocumented-public-function", "undocumented-public-module", "undocumented-public-package", "incorrect-blank-line-before-class", "multi-line-summary-second-line", # D
    "too-many-arguments", "magic-value-comparison" # PLR
]
unfixable = [
    "T20", # flake8-print
    "unused-variable" # F
]

[lint.isort]
split-on-trailing-comma = false

[format]
line-ending = "lf"
preview = true
quote-style = "preserve"
skip-magic-trailing-comma = true
