[fmt]
printWidth = 120
semi = false
trailingComma = "none"
sortImports = true
ignorePatterns = [".vscode", "vscode", "ruff.toml"]

[fmt.sortTailwindcss]

[[fmt.overrides]]
files = ["*.toml"]
options = { tabWidth = 4 }

[lint]
typeAware = true
ignorePatterns = ["**/node_modules/**", "**/dist/**", "**/build/**", "**/target/**", "**/coverage/**", "Vendor/**", "vendor/**", "**/src-tauri/gen/**"]
